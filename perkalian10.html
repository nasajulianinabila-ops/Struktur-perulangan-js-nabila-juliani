<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Tabel Perkalian 8</title>
</head>
<body>
  <h1>Tabel Perkalian 8</h1>
  <ul>
    <li>NIM: 262302003</li>
    <li>Nama: Nabila Nasa Juliani</li>
  </ul>

  <div id="hasil"></div>

  <script>
    const angka = 8;
    let isi = "";
    for (let i = 1; i <= 10; i++) {
      isi += angka + " x " + i + " = " + (angka * i) + "<br>";
    }
    document.getElementById("hasil").innerHTML = isi;
  </script>
</body>
</html>
